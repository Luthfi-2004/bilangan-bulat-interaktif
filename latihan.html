<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latihan - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tailwind-compiled.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-4xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-pen-to-square text-blue-600 mr-3"></i> Latihan Soal
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Pilih kategori latihan di bawah ini untuk menguji pemahamanmu.</p>
      </div>
      
      <div id="latihan-menu" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 hover:shadow-md hover:border-blue-300 transition-all cursor-pointer group flex flex-col h-full" onclick="mulaiLatihan('dasar')">
          <div class="h-3 w-full bg-blue-400 rounded-t-xl"></div>
          <div class="p-8 flex flex-col flex-1 text-center">
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 group-hover:scale-110 transition-transform">
              <i class="fa-solid fa-shapes"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-3">A. Operasi Dasar</h3>
            <p class="text-slate-500 mb-6 flex-1">Latihan penjumlahan, pengurangan, perkalian, dan pembagian dasar.</p>
            <button class="w-full py-3 px-4 border border-blue-600 text-blue-600 font-semibold rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-colors">
              Mulai Latihan Dasar
            </button>
          </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 hover:shadow-md hover:border-indigo-300 transition-all cursor-pointer group flex flex-col h-full" onclick="mulaiLatihan('campuran')">
          <div class="h-3 w-full bg-indigo-500 rounded-t-xl"></div>
          <div class="p-8 flex flex-col flex-1 text-center">
            <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4 group-hover:scale-110 transition-transform">
              <i class="fa-solid fa-layer-group"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-3">B. Operasi Campuran</h3>
            <p class="text-slate-500 mb-6 flex-1">Latihan hitung campuran yang lebih menantang (menggunakan prioritas kurung, kali, bagi).</p>
            <button class="w-full py-3 px-4 border border-indigo-600 text-indigo-600 font-semibold rounded-lg group-hover:bg-indigo-600 group-hover:text-white transition-colors">
              Mulai Latihan Campuran
            </button>
          </div>
        </div>
      </div>
      
      <div id="back-btn-container" style="display: none; margin-bottom: 24px;">
        <button class="inline-flex items-center px-4 py-2 text-slate-600 bg-white border border-slate-200 rounded-lg hover:bg-slate-50 transition-colors shadow-sm" onclick="kembaliKeMenu()">
          <i class="fa-solid fa-arrow-left mr-2"></i> Kembali ke Menu Latihan
        </button>
      </div>
      
      <div id="quiz-container" style="display: none;">
        <!-- Quiz engine akan merender soal di sini -->
      </div>
      
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { getQuestions } from './js/supabase-client.js';
    import { QuizEngine } from './js/quiz-engine.js';
    import { getSoalLatihanByTahap } from './js/soal-data.js';
    
    const TAHAP_CONFIG = {
      1: {
        judul: "Latihan 1: Konsep & Garis Bilangan",
        deskripsi: "Latihan pemahaman nilai mutlak, bilangan positif/negatif, dan tanda perbandingan.",
        jenis: "latihan_dasar",
        nextAction: { label: "Lanjut ke Materi 3: Penjumlahan", url: "materi/3-penjumlahan.html" }
      },
      2: {
        judul: "Latihan 2: Penjumlahan & Pengurangan",
        deskripsi: "Latihan menghitung penjumlahan dan pengurangan bilangan bertanda sama maupun beda.",
        jenis: "latihan_dasar",
        nextAction: { label: "Lanjut ke Materi 6: Perkalian", url: "materi/6-perkalian.html" }
      },
      3: {
        judul: "Latihan 3: Perkalian & Pembagian",
        deskripsi: "Latihan menguji aturan perkalian dan pembagian tanda sejenis maupun berbeda.",
        jenis: "latihan_dasar",
        nextAction: { label: "Lanjut ke Materi 8: Operasi Campuran", url: "materi/8-operasi-campuran.html" }
      },
      4: {
        judul: "Latihan 4: Operasi Hitung Campuran",
        deskripsi: "Tantangan penerapan hierarki KABATAKU (kurung, kali/bagi, tambah/kurang).",
        jenis: "latihan_campuran",
        nextAction: { label: "Lanjut ke Materi 9: Penerapan & Soal Cerita", url: "materi/9-penerapan.html" }
      }
    };

    window.mulaiLatihanTahap = async function(tahapNum) {
      const cfg = TAHAP_CONFIG[tahapNum] || TAHAP_CONFIG[1];
      const latihanMenu = document.querySelector('#app-content #latihan-menu') || document.getElementById('latihan-menu');
      const quizContainer = document.querySelector('#app-content #quiz-container') || document.getElementById('quiz-container');
      const backBtnContainer = document.querySelector('#app-content #back-btn-container') || document.getElementById('back-btn-container');

      if (latihanMenu) latihanMenu.style.display = 'none';
      if (quizContainer) quizContainer.style.display = 'block';
      if (backBtnContainer) backBtnContainer.style.display = 'block';
      
      const titleEl = document.querySelector('#app-content h1') || document.querySelector('h1');
      if (titleEl) {
        titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600 mr-3"></i> ${cfg.judul}`;
      }

      const soal = getSoalLatihanByTahap(tahapNum);
      if (quizContainer) quizContainer.innerHTML = '';
      new QuizEngine('#app-content #quiz-container', soal, cfg.jenis, null, cfg.nextAction);
    };

    window.mulaiLatihan = async function(kategori) {
      if (kategori === 'campuran') {
        window.mulaiLatihanTahap(4);
        return;
      }
      // Default ke dasar tahap 1 atau gabungan
      const latihanMenu = document.querySelector('#app-content #latihan-menu') || document.getElementById('latihan-menu');
      const quizContainer = document.querySelector('#app-content #quiz-container') || document.getElementById('quiz-container');
      const backBtnContainer = document.querySelector('#app-content #back-btn-container') || document.getElementById('back-btn-container');

      if (latihanMenu) latihanMenu.style.display = 'none';
      if (quizContainer) quizContainer.style.display = 'block';
      if (backBtnContainer) backBtnContainer.style.display = 'block';
      if (quizContainer) quizContainer.innerHTML = `
        <div class="py-16 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-600"></i>
          <p class="font-medium">Memuat soal latihan...</p>
        </div>
      `;
      
      const soal = await getQuestions('latihan_dasar');
      if (quizContainer) quizContainer.innerHTML = '';
      new QuizEngine('#app-content #quiz-container', soal, 'latihan_dasar', null, {
        label: 'Lanjut ke Operasi Campuran',
        url: 'materi/8-operasi-campuran.html'
      });
    };
    
    window.kembaliKeMenu = function() {
      const latihanMenu = document.querySelector('#app-content #latihan-menu') || document.getElementById('latihan-menu');
      const quizContainer = document.querySelector('#app-content #quiz-container') || document.getElementById('quiz-container');
      const backBtnContainer = document.querySelector('#app-content #back-btn-container') || document.getElementById('back-btn-container');

      if (latihanMenu) {
        latihanMenu.style.display = ''; 
        latihanMenu.classList.remove('hidden');
      }
      if (quizContainer) {
        quizContainer.style.display = 'none';
        quizContainer.innerHTML = '';
      }
      if (backBtnContainer) backBtnContainer.style.display = 'none';

      const titleEl = document.querySelector('#app-content h1') || document.querySelector('h1');
      if (titleEl) {
        titleEl.innerHTML = `<i class="fa-solid fa-pen-to-square text-blue-600 mr-3"></i> Latihan Soal`;
      }
    };

    function checkTahapFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const tahap = params.get('tahap');
      const kategori = params.get('kategori');

      if (tahap && [1, 2, 3, 4].includes(parseInt(tahap))) {
        window.mulaiLatihanTahap(parseInt(tahap));
      } else if (kategori === 'campuran') {
        window.mulaiLatihanTahap(4);
      } else if (kategori === 'dasar') {
        window.mulaiLatihan('dasar');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
        }
        checkTahapFromUrl();
      }, 100);
    });

    window.addEventListener('spa:navigated', () => {
      if (window.location.pathname.includes('/latihan.html')) {
        setTimeout(checkTahapFromUrl, 100);
      }
    });
  </script>
</body>
</html>
