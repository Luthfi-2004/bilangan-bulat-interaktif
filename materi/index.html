<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Materi - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <div id="page-container" class="max-w-5xl mx-auto space-y-8">
    <!-- Header Section -->
    <div class="border-b border-slate-200/80 pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 text-blue-700 text-xs font-semibold mb-2 border border-blue-100">
          <i class="fa-solid fa-graduation-cap"></i> Kurikulum Matematika Kelas VII
        </div>
        <h1 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight flex items-center gap-3">
          <i class="fa-solid fa-book-open text-blue-600"></i> Silabus Pembelajaran Mandiri
        </h1>
        <p class="text-slate-500 mt-1 text-sm md:text-base">Pilih submateri yang ingin kamu pelajari atau tinjau kembali hari ini.</p>
      </div>

      <div class="flex items-center gap-2">
        <a href="../tes-awal.html" class="px-4 py-2 bg-white border border-slate-200 hover:border-blue-300 text-slate-700 hover:text-blue-600 text-xs font-bold rounded-xl transition-all shadow-xs flex items-center gap-1.5">
          <i class="fa-solid fa-clipboard-check text-blue-600"></i> Tes Awal
        </a>
        <a href="../latihan.html" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl transition-all shadow-xs flex items-center gap-1.5">
          <i class="fa-solid fa-pen-to-square"></i> Latihan Soal
        </a>
      </div>
    </div>
    
    <!-- Dynamic Lessons Grid Container -->
    <div id="materi-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full py-16 text-center text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-600"></i>
        <p class="text-sm font-medium">Menyiapkan daftar materi pembelajaran...</p>
      </div>
    </div>
  </div>

  <script src="../js/layout.js"></script>
  <script type="module" src="../js/main.js"></script>
  <script type="module">
    import { getAllMateri } from '../js/supabase-client.js';

    const STATIC_FILES = [
      '1-definisi', '2-garis-bilangan', '3-penjumlahan', 
      '4-sifat-penjumlahan', '5-pengurangan', '6-perkalian', 
      '7-pembagian', '8-operasi-campuran', '9-penerapan'
    ];

    async function loadMateriCatalog() {
      const container = document.getElementById('materi-grid');
      if (!container) return;

      try {
        const list = await getAllMateri();
        if (!list || list.length === 0) {
          container.innerHTML = `
            <div class="col-span-full bg-white rounded-2xl p-12 text-center border border-slate-200">
              <i class="fa-solid fa-folder-open text-4xl text-slate-300 mb-3"></i>
              <h3 class="text-base font-bold text-slate-700">Belum Ada Materi Tersedia</h3>
              <p class="text-xs text-slate-500 mt-1">Bapak/Ibu Guru belum menginputkan materi pembelajaran ke sistem.</p>
            </div>
          `;
          return;
        }

        let html = '';
        list.forEach((item, index) => {
          const num = item.urutan || (index + 1);
          const isHighlight = item.slug === '8-operasi-campuran';
          
          // Tentukan target link: jika file html statis ada, buka file tersebut; jika custom guru, buka baca.html
          let targetUrl = `${item.slug}.html`;
          if (!STATIC_FILES.includes(item.slug)) {
            targetUrl = `baca.html?slug=${encodeURIComponent(item.slug)}`;
          }

          html += `
            <a href="${targetUrl}" class="group block relative bg-white rounded-2xl border ${isHighlight ? 'border-indigo-300 ring-1 ring-indigo-200' : 'border-slate-200'} p-6 shadow-xs hover:shadow-md hover:border-blue-400 transition-all duration-200 flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between mb-4">
                  <div class="w-10 h-10 rounded-xl ${isHighlight ? 'bg-indigo-50 text-indigo-700 border-indigo-200' : 'bg-slate-100 text-slate-700 border-slate-200'} border flex items-center justify-center font-black text-sm group-hover:bg-blue-600 group-hover:text-white group-hover:border-blue-600 transition-all">
                    ${num}
                  </div>
                  ${isHighlight ? `
                    <span class="text-[10px] font-bold tracking-wider uppercase px-2.5 py-1 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
                      Materi Inti
                    </span>
                  ` : `
                    <span class="text-[11px] font-medium text-slate-400">Submateri #${num}</span>
                  `}
                </div>
                
                <h3 class="font-bold text-slate-900 group-hover:text-blue-600 transition-colors text-base mb-2 leading-snug">
                  ${item.judul || 'Materi Belajar'}
                </h3>
                
                <p class="text-xs text-slate-500 leading-relaxed line-clamp-2">
                  ${item.ringkasan || 'Pelajari konsep lengkap bilangan bulat pada bab ini.'}
                </p>
              </div>

              <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-blue-600 group-hover:translate-x-0.5 transition-transform">
                <span>Pelajari Materi</span>
                <i class="fa-solid fa-arrow-right text-[11px]"></i>
              </div>
            </a>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error("Gagal load catalog materi:", err);
        container.innerHTML = `
          <div class="col-span-full bg-red-50 text-red-700 p-6 rounded-2xl text-center text-sm font-medium border border-red-200">
            Terjadi kendala saat memuat silabus materi. Silakan segarkan halaman.
          </div>
        `;
      }
    }

    // Inisialisasi awal dan saat navigasi SPA
    document.addEventListener('DOMContentLoaded', loadMateriCatalog);
    window.addEventListener('spa:navigated', () => {
      if (window.location.pathname.includes('/materi/index.html') || window.location.pathname.endsWith('/materi/')) {
        loadMateriCatalog();
      }
    });
  </script>
</body>
</html>
