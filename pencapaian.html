<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencapaian - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-5xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-medal text-blue-600 mr-3"></i> Pencapaian
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Kumpulkan semua lencana (badge) ini dengan menyelesaikan berbagai aktivitas belajar!</p>
      </div>
      
      <div id="badge-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-8">
        <div class="col-span-full py-16 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
          <p>Memuat data lencana...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { BADGES, checkAndUnlockBadges } from './js/badge-engine.js';
    import { getStudentBadges } from './js/supabase-client.js';
    
    // Map emoji ke fontawesome untuk kompatibilitas data lama
    const iconMap = {
      "🔰": "fa-shield-halved text-blue-500",
      "📚": "fa-book-open text-indigo-500",
      "✏️": "fa-pen text-emerald-500",
      "🎮": "fa-gamepad text-purple-500",
      "🧠": "fa-brain text-pink-500",
      "🏆": "fa-trophy text-amber-500",
      "👑": "fa-crown text-amber-400"
    };
    
    async function renderBadges() {
      const student = window.getCurrentStudent();
      let unlockedIds = [];
      
      if (student) {
        await checkAndUnlockBadges(student.id);
        unlockedIds = await getStudentBadges(student.id);
      }
      
      const container = document.getElementById('badge-container');
      if (!container) return;
      
      let html = '';
      BADGES.forEach(b => {
        const isUnlocked = unlockedIds.includes(b.id);
        const iconClass = iconMap[b.icon] || "fa-medal text-blue-500";
        
        if (isUnlocked) {
          html += `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 text-center flex flex-col items-center justify-center hover:shadow-md transition-shadow relative overflow-hidden group">
              <div class="absolute inset-0 bg-gradient-to-br from-amber-50 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
              
              <div class="w-16 h-16 rounded-full bg-slate-50 flex items-center justify-center text-3xl mb-4 shadow-inner relative z-10">
                <i class="fa-solid ${iconClass}"></i>
              </div>
              <h3 class="font-bold text-slate-800 mb-1 relative z-10">${b.nama}</h3>
              <p class="text-xs text-slate-500 flex-1 relative z-10">${b.deskripsi}</p>
              <div class="mt-4 pt-3 border-t border-slate-100 w-full text-emerald-600 font-bold text-xs uppercase tracking-wider relative z-10">
                <i class="fa-solid fa-unlock mr-1"></i> Terbuka
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="bg-slate-50 rounded-xl border border-slate-200 border-dashed p-6 text-center flex flex-col items-center justify-center opacity-60">
              <div class="w-16 h-16 rounded-full bg-slate-200 flex items-center justify-center text-3xl mb-4 text-slate-400 grayscale">
                <i class="fa-solid ${iconClass}"></i>
              </div>
              <h3 class="font-bold text-slate-500 mb-1">${b.nama}</h3>
              <p class="text-xs text-slate-400 flex-1">${b.deskripsi}</p>
              <div class="mt-4 pt-3 border-t border-slate-200 w-full text-slate-400 font-bold text-xs uppercase tracking-wider">
                <i class="fa-solid fa-lock mr-1"></i> Terkunci
              </div>
            </div>
          `;
        }
      });
      
      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
          renderBadges();
        }
      }, 100);
    });
  </script>
</body>
</html>
