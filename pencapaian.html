<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencapaian - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tailwind-compiled.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-5xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-medal text-blue-600 mr-3"></i> Pencapaian
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Kumpulkan semua lencana (badge) ini dengan menyelesaikan berbagai aktivitas belajar!</p>
      </div>
      
      <div id="badge-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-8">
        <div class="col-span-full py-16 text-center text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3"></i>
          <p>Memuat data lencana...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { BADGES, checkAndUnlockBadges } from './js/badge-engine.js';
    import { getStudentBadges } from './js/supabase-client.js';
    
    // Map ID badge ke fontawesome icon dan warna
    const badgeIcons = {
      "b_pemula": { icon: "fa-shield-halved", color: "text-blue-500", bg: "bg-blue-50" },
      "b_rajin_belajar": { icon: "fa-book-open", color: "text-indigo-500", bg: "bg-indigo-50" },
      "b_rajin_berlatih": { icon: "fa-pencil", color: "text-emerald-500", bg: "bg-emerald-50" },
      "b_pemburu_skor": { icon: "fa-gamepad", color: "text-purple-500", bg: "bg-purple-50" },
      "b_jago_bilbul": { icon: "fa-brain", color: "text-pink-500", bg: "bg-pink-50" },
      "b_master": { icon: "fa-trophy", color: "text-amber-500", bg: "bg-amber-50" },
      "b_champion": { icon: "fa-crown", color: "text-amber-400", bg: "bg-amber-50" }
    };
    
    async function renderBadges() {
      const student = window.getCurrentStudent();
      let unlockedIds = [];
      
      if (student) {
        await checkAndUnlockBadges(student.id);
        unlockedIds = await getStudentBadges(student.id);
      }
      
      const container = document.querySelector('#app-content #badge-container') || document.getElementById('badge-container');
      if (!container) return;
      
      let html = '';
      
      // Ringkasan progres lencana di paling atas
      html += `
        <div class="col-span-full mb-2 bg-white rounded-xl p-4 border border-slate-200 flex items-center justify-between shadow-xs">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center font-bold text-lg">
              <i class="fa-solid fa-medal"></i>
            </div>
            <div>
              <div class="font-bold text-slate-800 text-sm">Koleksi Lencana Kamu</div>
              <div class="text-xs text-slate-500">${unlockedIds.length} dari ${BADGES.length} lencana berhasil dibuka</div>
            </div>
          </div>
          <div class="w-32 bg-slate-100 rounded-full h-2.5 overflow-hidden">
            <div class="bg-amber-500 h-2.5 rounded-full transition-all duration-500" style="width: ${(unlockedIds.length / BADGES.length) * 100}%"></div>
          </div>
        </div>
      `;

      BADGES.forEach(b => {
        const isUnlocked = unlockedIds.includes(b.id);
        const meta = badgeIcons[b.id] || { icon: "fa-medal", color: "text-blue-500", bg: "bg-slate-50" };
        
        if (isUnlocked) {
          html += `
            <div class="bg-white rounded-xl shadow-xs border border-slate-200 p-6 text-center flex flex-col items-center justify-center hover:shadow-md hover:border-amber-300 transition-all relative overflow-hidden group">
              <div class="absolute inset-0 bg-gradient-to-br from-amber-500/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
              
              <div class="w-16 h-16 rounded-2xl ${meta.bg} ${meta.color} flex items-center justify-center text-3xl mb-4 shadow-xs relative z-10">
                <i class="fa-solid ${meta.icon}"></i>
              </div>
              <h3 class="font-bold text-slate-800 mb-1 relative z-10">${b.nama}</h3>
              <p class="text-xs text-slate-500 flex-1 relative z-10 leading-relaxed">${b.deskripsi}</p>
              <div class="mt-4 pt-3 border-t border-slate-100 w-full text-emerald-600 font-bold text-xs uppercase tracking-wider relative z-10 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-circle-check"></i> Terbuka
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="bg-slate-50 rounded-xl border border-slate-200 border-dashed p-6 text-center flex flex-col items-center justify-center opacity-70">
              <div class="w-16 h-16 rounded-2xl bg-slate-200 flex items-center justify-center text-2xl mb-4 text-slate-400">
                <i class="fa-solid fa-lock"></i>
              </div>
              <h3 class="font-bold text-slate-500 mb-1">${b.nama}</h3>
              <p class="text-xs text-slate-400 flex-1 leading-relaxed">${b.deskripsi}</p>
              <div class="mt-4 pt-3 border-t border-slate-200 w-full text-slate-400 font-bold text-xs uppercase tracking-wider flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-lock"></i> Terkunci
              </div>
            </div>
          `;
        }
      });
      
      container.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
          renderBadges();
        }
      }, 100);
    });

    window.addEventListener('spa:navigated', () => {
      if (window.location.pathname.includes('/pencapaian.html')) {
        renderBadges();
      }
    });
  </script>
</body>
</html>
