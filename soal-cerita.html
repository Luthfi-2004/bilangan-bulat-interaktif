<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soal Cerita - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-4xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-comment-dots text-blue-600 mr-3"></i> Soal Cerita
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Terapkan konsep bilangan bulat pada permasalahan kehidupan sehari-hari.</p>
      </div>
      
      <div id="soal-cerita-container" class="space-y-6 mt-8">
        <!-- Dirender via JS -->
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { SOAL_CERITA } from './js/soal-data.js';
    
    window.togglePembahasan = function(id) {
      const el = document.getElementById('pembahasan-' + id);
      const btn = document.getElementById('btn-pembahasan-' + id);
      const icon = btn.querySelector('i');
      
      if (el.classList.contains('hidden')) {
        el.classList.remove('hidden');
        btn.innerHTML = 'Sembunyikan Pembahasan <i class="fa-solid fa-chevron-up ml-2"></i>';
        btn.classList.add('bg-slate-100');
      } else {
        el.classList.add('hidden');
        btn.innerHTML = 'Lihat Pembahasan <i class="fa-solid fa-chevron-down ml-2"></i>';
        btn.classList.remove('bg-slate-100');
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
          
          const scContainer = document.getElementById('soal-cerita-container');
          if (scContainer) {
            let html = '';
            SOAL_CERITA.forEach((soal, index) => {
              html += `
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
                  <div class="p-6 md:p-8 flex flex-col md:flex-row gap-6">
                    <div class="flex-shrink-0">
                      <div class="w-14 h-14 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center font-bold text-2xl shadow-inner">
                        ${index + 1}
                      </div>
                    </div>
                    
                    <div class="flex-1">
                      <h3 class="text-xl font-bold text-slate-800 mb-3">${soal.judul}</h3>
                      <p class="text-slate-600 text-lg leading-relaxed mb-6">${soal.pertanyaan}</p>
                      
                      <button id="btn-pembahasan-${soal.id}" class="inline-flex items-center px-4 py-2 text-blue-700 bg-blue-50 hover:bg-blue-100 font-medium rounded-lg transition-colors focus:outline-none" onclick="togglePembahasan('${soal.id}')">
                        Lihat Pembahasan <i class="fa-solid fa-chevron-down ml-2"></i>
                      </button>
                      
                      <div id="pembahasan-${soal.id}" class="hidden mt-6 bg-slate-50 p-6 rounded-xl border border-slate-200">
                        <div class="flex items-center gap-3 mb-4">
                          <i class="fa-solid fa-circle-check text-emerald-500 text-xl"></i>
                          <p class="font-bold text-slate-800 text-lg">Jawaban Akhir: <span class="text-blue-600">${soal.jawaban}</span></p>
                        </div>
                        <div class="border-t border-slate-200 pt-4">
                          <strong class="text-slate-700 block mb-2"><i class="fa-solid fa-list-ol mr-2 text-slate-400"></i>Langkah Penyelesaian:</strong>
                          <p class="text-slate-600 leading-relaxed font-mono bg-white p-3 rounded border border-slate-100">${soal.pembahasan}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              `;
            });
            scContainer.innerHTML = html;
          }
        }
      }, 100);
    });
  </script>
</body>
</html>
