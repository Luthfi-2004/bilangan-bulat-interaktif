<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Akhir - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tailwind-compiled.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-4xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-stopwatch text-blue-600 mr-3"></i> Kuis Akhir
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Buktikan pemahamanmu dengan menjawab soal evaluasi akhir ini.</p>
      </div>
      
      <div id="intro-container" class="bg-white rounded-xl shadow-sm border border-slate-100 p-8 md:p-12 text-center my-8">
        <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h3 class="text-2xl font-bold text-slate-800 mb-4">Siap untuk memulai kuis?</h3>
        <p class="text-slate-600 mb-8 max-w-lg mx-auto text-lg">
          Kuis ini menggabungkan soal-soal penjumlahan, pengurangan, perkalian, pembagian, serta operasi hitung campuran secara acak.
        </p>
        <button class="px-8 py-4 text-lg bg-blue-600 text-white font-bold rounded-xl shadow-md hover:bg-blue-700 hover:shadow-lg transition-all focus:outline-none focus:ring-4 focus:ring-blue-300" onclick="mulaiKuis()">
          Mulai Kuis Sekarang <i class="fa-solid fa-paper-plane ml-2"></i>
        </button>
      </div>

      <div id="quiz-container" style="display: none;">
        <!-- Quiz engine merender di sini -->
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { getQuestions } from './js/supabase-client.js';
    import { QuizEngine } from './js/quiz-engine.js';
    
    window.mulaiKuis = async function() {
      const btn = document.querySelector('#intro-container button');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Menyiapkan Soal Kuis...`;
      }

      const questions = await getQuestions('kuis');

      document.getElementById('intro-container').style.display = 'none';
      document.getElementById('quiz-container').style.display = 'block';
      
      new QuizEngine('quiz-container', questions, 'kuis');
    };

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
        }
      }, 100);
    });
  </script>
</body>
</html>
