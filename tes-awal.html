<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Awal - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tailwind-compiled.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-3xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-clipboard-list text-blue-600 mr-3"></i> Tes Awal (Diagnostik)
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Kerjakan 5 soal ini untuk melihat pemahaman dasar kamu sebelum masuk ke materi.</p>
      </div>
      
      <div id="intro-container" class="bg-white rounded-xl shadow-sm border border-slate-100 p-8 text-center mb-8">
        <h3 class="text-2xl font-bold text-slate-800 mb-4">Siap untuk memulai?</h3>
        <p class="text-slate-600 mb-8 max-w-lg mx-auto">Jangan khawatir jika kamu belum tahu jawabannya. Tes ini hanya untuk mengukur sejauh mana kamu sudah mengenal bilangan bulat.</p>
        <button class="px-8 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-300" onclick="mulaiTes()">
          Mulai Tes Awal <i class="fa-solid fa-play ml-2"></i>
        </button>
      </div>

      <div id="quiz-container" style="display: none;">
        <!-- Quiz engine merender di sini -->
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    import { getQuestions } from './js/supabase-client.js';
    import { QuizEngine } from './js/quiz-engine.js';
    
    window.mulaiTes = async function() {
      const btn = document.querySelector('#intro-container button');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Memuat Soal...`;
      }

      const questions = await getQuestions('tes_awal');
      
      document.getElementById('intro-container').style.display = 'none';
      document.getElementById('quiz-container').style.display = 'block';
      
      new QuizEngine('quiz-container', questions, 'tes_awal');
    };

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
        }
      }, 100);
    });
  </script>
</body>
</html>
