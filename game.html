<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game - Operasi Campuran Bilangan Bulat</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/tailwind-compiled.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Layout will be dynamically injected by js/layout.js -->
  <div id="page-container" style="display: none;">
    <div class="max-w-4xl mx-auto">
      <div class="mb-8 border-b border-slate-200 pb-4">
        <h1 class="text-3xl font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-gamepad text-blue-600 mr-3"></i> Game Area
        </h1>
        <p class="text-slate-500 mt-2 text-lg">Perkuat pemahamanmu melalui permainan interaktif!</p>
      </div>
      
      <div id="game-menu" class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 hover:shadow-lg hover:border-amber-300 transition-all cursor-pointer group flex flex-col overflow-hidden" onclick="mulaiGame('tantangan')">
          <div class="h-3 w-full bg-amber-400"></div>
          <div class="p-8 flex flex-col flex-1 text-center items-center">
            <div class="w-20 h-20 bg-amber-50 text-amber-500 rounded-full flex items-center justify-center text-4xl mb-6 group-hover:scale-110 group-hover:rotate-12 transition-transform shadow-inner">
              <i class="fa-solid fa-stopwatch"></i>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-3">Tantangan Operasi</h3>
            <p class="text-slate-500 mb-8 flex-1 leading-relaxed">Jawab operasi campuran dengan batas waktu 15 detik! Benar = +10 poin, Salah = Game Over.</p>
            <button class="w-full py-3 px-4 bg-amber-500 text-white font-bold rounded-lg group-hover:bg-amber-600 shadow-md transition-colors">
              Mainkan Sekarang <i class="fa-solid fa-play ml-2"></i>
            </button>
          </div>
        </div>
        
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 hover:shadow-lg hover:border-emerald-300 transition-all cursor-pointer group flex flex-col overflow-hidden" onclick="mulaiGame('benar_salah')">
          <div class="h-3 w-full bg-emerald-400"></div>
          <div class="p-8 flex flex-col flex-1 text-center items-center">
            <div class="w-20 h-20 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center text-4xl mb-6 group-hover:scale-110 transition-transform shadow-inner">
              <div class="flex gap-1"><i class="fa-solid fa-check text-emerald-500"></i><i class="fa-solid fa-xmark text-red-500"></i></div>
            </div>
            <h3 class="text-2xl font-bold text-slate-800 mb-3">Benar atau Salah</h3>
            <p class="text-slate-500 mb-8 flex-1 leading-relaxed">Tebak pernyataan perkalian dan pembagian yang muncul, apakah itu benar atau salah.</p>
            <button class="w-full py-3 px-4 bg-emerald-500 text-white font-bold rounded-lg group-hover:bg-emerald-600 shadow-md transition-colors">
              Mainkan Sekarang <i class="fa-solid fa-play ml-2"></i>
            </button>
          </div>
        </div>
        
      </div>
      
      <div id="game-container" class="bg-white rounded-xl shadow-lg border border-slate-200 p-8 md:p-12 text-center" style="display: none;">
        <div id="game-header" class="flex justify-between items-center mb-10 pb-4 border-b border-slate-100">
          <div class="flex items-center gap-2 px-4 py-2 bg-blue-50 text-blue-700 font-bold rounded-lg">
            <i class="fa-solid fa-star text-amber-400"></i> <span id="game-score">Skor: 0</span>
          </div>
          <div id="timer-badge" class="flex items-center gap-2 px-4 py-2 bg-red-50 text-red-600 font-bold rounded-lg">
            <i class="fa-solid fa-clock"></i> <span id="game-timer">15s</span>
          </div>
        </div>
        
        <div id="game-question" class="text-4xl md:text-6xl font-black text-slate-800 my-12 font-mono tracking-tight drop-shadow-sm">
          <!-- Soal -->
        </div>
        
        <div id="game-controls" class="flex flex-wrap justify-center gap-4">
          <!-- Tombol akan dirender via JS -->
        </div>
        
        <div id="game-over" style="display: none;" class="mt-8">
          <h2 class="text-4xl font-black text-red-500 mb-4 tracking-wider"><i class="fa-solid fa-skull-crossbones mr-3"></i>GAME OVER</h2>
          <div id="game-over-msg" class="text-xl text-slate-600 mb-8 bg-slate-50 p-6 rounded-xl border border-slate-200"></div>
          <button class="px-8 py-3 bg-blue-600 text-white font-bold rounded-lg shadow-md hover:bg-blue-700 transition-colors focus:outline-none" onclick="kembaliKeMenu()">
            <i class="fa-solid fa-rotate-left mr-2"></i> Main Lagi
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/layout.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module">
    // Logic Game Sederhana
    let currentMode = '';
    let score = 0;
    let timer = 15;
    let intervalId = null;
    let correctAnswer = null;
    
    function getEl(id) {
      return document.querySelector('#app-content #' + id) || document.getElementById(id);
    }

    window.mulaiGame = function(mode) {
      currentMode = mode;
      score = 0;
      
      if (getEl('game-menu')) getEl('game-menu').style.display = 'none';
      if (getEl('game-container')) getEl('game-container').style.display = 'block';
      if (getEl('game-over')) getEl('game-over').style.display = 'none';
      if (getEl('game-controls')) getEl('game-controls').style.display = 'flex';
      if (getEl('game-score')) getEl('game-score').textContent = 'Skor: 0';
      
      if (mode === 'tantangan') {
        if (getEl('timer-badge')) getEl('timer-badge').style.display = 'flex';
        nextTantangan();
      } else if (mode === 'benar_salah') {
        if (getEl('timer-badge')) getEl('timer-badge').style.display = 'none';
        nextBenarSalah();
      }
    };
    
    function startTimer() {
      timer = 15;
      if (getEl('game-timer')) getEl('game-timer').textContent = timer + 's';
      clearInterval(intervalId);
      
      intervalId = setInterval(() => {
        timer--;
        if (getEl('game-timer')) getEl('game-timer').textContent = timer + 's';
        if (timer <= 0) {
          gameOver("Waktu habis!");
        }
      }, 1000);
    }
    
    function nextTantangan() {
      const ops = ['+', '-'];
      const op = ops[Math.floor(Math.random() * ops.length)];
      
      const a = Math.floor(Math.random() * 20) - 10;
      const b = Math.floor(Math.random() * 10) - 5;
      const c = Math.floor(Math.random() * 5) + 1; // 1 to 5
      
      let soalStr = "";
      
      if (op === '+') {
        soalStr = `${a} + ${b} Ã— ${c}`;
        correctAnswer = a + (b * c);
      } else {
        soalStr = `${a} âˆ’ (${b} Ã— ${c})`;
        correctAnswer = a - (b * c);
      }
      
      if (getEl('game-question')) getEl('game-question').textContent = soalStr + " = ?";
      
      let options = [correctAnswer];
      while(options.length < 4) {
        let wr = correctAnswer + (Math.floor(Math.random() * 20) - 10);
        if (wr !== correctAnswer && !options.includes(wr)) options.push(wr);
      }
      
      options.sort(() => Math.random() - 0.5);
      
      const controls = getEl('game-controls');
      if (controls) {
        controls.innerHTML = '';
      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'px-8 py-4 text-2xl font-bold bg-white text-blue-600 border-2 border-blue-600 rounded-xl hover:bg-blue-600 hover:text-white transition-colors focus:outline-none focus:ring-4 focus:ring-blue-300 w-full sm:w-auto min-w-[120px]';
        btn.textContent = opt;
        btn.onclick = () => window.cekJawaban(opt);
        controls.appendChild(btn);
      });
      }
      
      startTimer();
    }
    
    function nextBenarSalah() {
      const a = Math.floor(Math.random() * 10) - 5; 
      const b = Math.floor(Math.random() * 10) - 5; 
      
      const isCorrect = Math.random() > 0.5;
      const trueAns = a * b;
      const displayAns = isCorrect ? trueAns : trueAns + (Math.random() > 0.5 ? 2 : -2);
      
      const aStr = a < 0 ? `(${a})` : a;
      const bStr = b < 0 ? `(${b})` : b;
      
      if (getEl('game-question')) getEl('game-question').innerHTML = `${aStr} × ${bStr} = ${displayAns}`;
      correctAnswer = isCorrect;
      
      const controls = getEl('game-controls');
      if (controls) {
        controls.innerHTML = `
        <button class="px-10 py-5 text-2xl font-bold bg-emerald-500 text-white rounded-xl shadow hover:bg-emerald-600 transition-colors focus:outline-none focus:ring-4 focus:ring-emerald-300 w-full sm:w-auto" onclick="cekJawaban(true)"><i class="fa-solid fa-check mr-2"></i> BENAR</button>
        <button class="px-10 py-5 text-2xl font-bold bg-red-500 text-white rounded-xl shadow hover:bg-red-600 transition-colors focus:outline-none focus:ring-4 focus:ring-red-300 w-full sm:w-auto" onclick="cekJawaban(false)"><i class="fa-solid fa-xmark mr-2"></i> SALAH</button>
      `;
      }
    }
    
    window.cekJawaban = function(jawabanUser) {
      if (jawabanUser === correctAnswer) {
        score += 10;
        if (getEl('game-score')) getEl('game-score').textContent = 'Skor: ' + score;
        
        if (currentMode === 'tantangan') nextTantangan();
        else nextBenarSalah();
      } else {
        gameOver("Jawabanmu kurang tepat!");
      }
    }
    
    async function gameOver(msg) {
      clearInterval(intervalId);
      if (getEl('game-controls')) getEl('game-controls').style.display = 'none';
      if (getEl('game-over')) getEl('game-over').style.display = 'block';
      if (getEl('game-over-msg')) getEl('game-over-msg').innerHTML = `<div class="font-bold text-slate-800 mb-2">${msg}</div>Skor Akhirmu: <strong class="text-2xl text-blue-600 ml-2">${score}</strong>`;
      
      try {
        const { saveTestResult } = await import('./js/supabase-client.js');
        const { checkAndUnlockBadges } = await import('./js/badge-engine.js');
        const student = window.getCurrentStudent();
        if (student) {
          await saveTestResult(student.id, 'game', score);
          await checkAndUnlockBadges(student.id, true);
        }
      } catch(e) {
        console.warn("Gagal menyimpan skor game:", e);
      }
    }
    
    window.kembaliKeMenu = function() {
      // Fix for Tailwind grid display
      const gameMenu = getEl('game-menu');
      if (gameMenu) {
        gameMenu.style.display = '';
        gameMenu.classList.remove('hidden');
      }
      if (getEl('game-container')) getEl('game-container').style.display = 'none';
    };

    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const contentContainer = document.getElementById('app-content');
        const pageContainer = document.getElementById('page-container');
        if (contentContainer && pageContainer) {
          contentContainer.innerHTML = pageContainer.innerHTML;
        }
      }, 100);
    });

    window.addEventListener('spa:navigated', () => {
      if (window.location.pathname.includes('/game.html')) {
        if (typeof window.kembaliKeMenu === 'function') {
          window.kembaliKeMenu();
        }
      }
    });
  </script>
</body>
</html>
